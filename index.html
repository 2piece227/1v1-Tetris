<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블럭아웃 대전 · 1P vs 2P</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: system-ui, "Malgun Gothic", sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

      /* Control legend, one per side. Cabinet players read this once while
         waiting in the queue, so it sits low and out of the playfield. */
      .legend {
        position: fixed; bottom: 14px; color: #7f8bb5; font-size: 12px; line-height: 1.7;
        user-select: none; pointer-events: none; white-space: nowrap;
      }
      .legend.p1 { left: 3%; }
      .legend.p2 { right: 3%; text-align: right; }
      .legend b { color: #c3ccf0; }
      .legend kbd {
        background: #161d38; border: 1px solid #2b3560; border-radius: 3px;
        padding: 0 5px; font-family: inherit; font-size: 11px; color: #cdd5ff;
      }

      /* Start card and win card share styling; only one is ever shown. */
      #start, #banner {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        flex-direction: column; gap: 20px; background: rgba(4,6,12,0.78); color: #fff; text-align: center;
      }
      #start.show, #banner.show { display: flex; }
      #bannerText { font-size: 64px; font-weight: 800; letter-spacing: 2px; }
      #start h1 { font-size: 68px; font-weight: 800; letter-spacing: 4px; color: #eef2ff; }
      #start p { color: #9aa5d4; font-size: 16px; line-height: 1.9; }
      #start .keys { color: #7c8bff; font-weight: 700; }
      #banner button, #start button {
        font-size: 18px; font-weight: 700; color: #05060a; background: #7c8bff;
        border: none; border-radius: 10px; padding: 14px 34px; cursor: pointer;
      }
      #banner small { color: #9aa5d4; font-size: 14px; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="legend p1">
      <b>1P</b> 이동 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;
      회전 <kbd>Q</kbd><kbd>E</kbd><kbd>R</kbd><br />
      떨구기 <kbd>Space</kbd>
    </div>

    <div class="legend p2">
      <b>2P</b> 이동 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> &nbsp;
      회전 <kbd>U</kbd><kbd>I</kbd><kbd>O</kbd><br />
      떨구기 <kbd>Enter</kbd>
    </div>

    <div id="start" class="show">
      <h1>게임 시작</h1>
      <p>
        1P <span class="keys">Space</span> &nbsp;·&nbsp; 2P <span class="keys">Enter</span><br />
        아무 쪽이나 누르면 시작합니다
      </p>
      <button id="startBtn">시작</button>
    </div>

    <div id="banner">
      <div id="bannerText">1P 승리</div>
      <button id="restartBtn">다시 시작</button>
      <small>Space / Enter</small>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
